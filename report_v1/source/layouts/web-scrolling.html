<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>长滚动网页骨架</title>
  <!-- 1. 主题 -->
  <link rel="stylesheet" href="../tokens/theme-darktech.css" />
  <!-- <link rel="stylesheet" href="../tokens/theme-business.css" /> -->
  <!-- <link rel="stylesheet" href="../tokens/theme-corporate.css" /> -->
<!-- <link rel="stylesheet" href="../tokens/theme-finance.css" /> -->
  <!-- 2. 版式 -->
  <link rel="stylesheet" href="web-scrolling.css" />
  <!-- 3. 按需引入组件 -->
  <link rel="stylesheet" href="../components/button.css" />
</head>
<body class="theme-darktech">

  <!-- ==================== 导航栏 ==================== -->
  <nav class="nav">
    <div class="nav-inner">
      <div class="brand">品牌名称</div>
      <div class="nav-links">
        <a href="#overview">概览</a>
        <a href="#features">功能</a>
        <a href="#data">数据</a>
        <a href="#contact">联系</a>
      </div>
    </div>
  </nav>

  <!-- ==================== Hero区 ==================== -->
  <section class="hero">
    <div>
      <div class="eyebrow">✦ 金融服务</div>
      <h1>主标题文案</h1>
      <p>描述文字，简要说明服务的核心价值主张和目标受众。</p>
      <div class="hero-actions">
        <button class="btn primary">主要行动</button>
        <button class="btn">次要行动</button>
      </div>
    </div>
    <div class="hero-card">
      <h3>关键数据总览</h3>
      <div class="stat-grid">
        <div class="stat">
          <strong>+12.5%</strong>
          <span>指标说明一</span>
        </div>
        <div class="stat">
          <strong>3,200+</strong>
          <span>指标说明二</span>
        </div>
        <div class="stat">
          <strong>98%</strong>
          <span>指标说明三</span>
        </div>
        <div class="stat">
          <strong>A+</strong>
          <span>指标说明四</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ==================== 内容Section ==================== -->
  <section id="overview">
    <div class="section-head">
      <h2>板块标题</h2>
      <p>板块描述文字，补充说明此板块的内容定位。</p>
    </div>
    <div class="landing-grid">
      <!-- 在此填充内容卡片 -->
    </div>
  </section>

</body>
</html>
