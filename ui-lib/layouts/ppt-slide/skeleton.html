<!-- PPT Slide 翻页骨架：100vw×100vh 固定屏，按钮 + 键盘翻页 -->
<div class="ppt-container">
  <!-- 第 1 页 -->
  <section class="ppt-slide active" data-slide="1">
    <div class="slide-content">
      <!-- 封面内容 -->
    </div>
    <footer class="slide-footer">1 / {{total}}</footer>
  </section>

  <!-- 第 2 页 -->
  <section class="ppt-slide" data-slide="2">
    <div class="slide-content">
      <!-- 内容 -->
    </div>
    <footer class="slide-footer">2 / {{total}}</footer>
  </section>

  <!-- 翻页按钮 -->
  <button class="ppt-nav-btn ppt-prev-btn">← 上一页</button>
  <button class="ppt-nav-btn ppt-next-btn">下一页 →</button>
</div>
