<!-- PPT Slide 翻页骨架 -->
<div class="ppt-container">
  <!-- ===== 第 1 页 ===== -->
  <section class="ppt-slide active" data-slide="1">
    <div class="slide-content">
      <!-- AI 在此填充封面内容 -->
    </div>
    <footer class="slide-footer">1 / {{total}}</footer>
  </section>

  <!-- ===== 第 2 页 ===== -->
  <section class="ppt-slide" data-slide="2">
    <div class="slide-content">
      <!-- AI 在此填充第2页内容 -->
    </div>
    <footer class="slide-footer">2 / {{total}}</footer>
  </section>

  <!-- 导航点 -->
  <div class="ppt-nav-dots">
    <button class="ppt-nav-dot active" data-target="1"></button>
    <button class="ppt-nav-dot" data-target="2"></button>
  </div>
</div>
