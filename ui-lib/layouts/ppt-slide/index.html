<!DOCTYPE html>
<html lang="zh-CN" data-theme="business-blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPT Slide 翻页 — 版式预览</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../../design-tokens/tokens.css">
<link rel="stylesheet" href="layout.css">
<style>
  body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); margin: 0; overflow: hidden; }
  .back-bar { position: fixed; top: 16px; left: 24px; z-index: 200; }
  .back-link { color: var(--color-accent); text-decoration: none; font-size: var(--text-sm); background: var(--color-bg-card); padding: 6px 14px; border-radius: var(--radius-sm); box-shadow: var(--shadow-card); }
  .theme-bar { position: fixed; top: 16px; right: 24px; z-index: 200; display: flex; gap: 6px; }
  .theme-btn { padding: 5px 12px; border-radius: var(--radius-sm); border: 2px solid var(--color-border); background: var(--color-bg-card); color: var(--color-text); cursor: pointer; font-size: var(--text-xs); box-shadow: var(--shadow-card); }
  .theme-btn.active { border-color: var(--color-primary); background: var(--color-primary); color: #fff; font-weight: 600; }
  .keyboard-hint { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); font-size: var(--text-xs); color: var(--color-text-muted); z-index: 200; opacity: 0.5; }
</style>
</head>
<body>
<div class="back-bar"><a href="../../gallery.html" class="back-link">&larr; 返回总览</a></div>
<div class="theme-bar">
  <button class="theme-btn active" data-theme="business-blue">商务蓝白</button>
  <button class="theme-btn" data-theme="dark-tech">暗黑科技</button>
  <button class="theme-btn" data-theme="fresh-clean">清新简约</button>
</div>
<div class="keyboard-hint">← → 方向键翻页 · 点击底部按钮翻页</div>

<div class="ppt-container" id="pptContainer">
  <!-- Slide 1: 封面 -->
  <section class="ppt-slide active" data-slide="1" style="background:var(--color-bg)">
    <div class="slide-content flex flex-col justify-center items-center text-center">
      <h1 class="text-6xl font-bold mb-6" style="color:var(--color-primary)">[报告标题]</h1>
      <p class="text-xl mb-12" style="color:var(--color-text-muted)">[副标题] · [日期]</p>
      <div class="h-1 w-32 rounded-full mb-12" style="background:var(--color-accent)"></div>
      <p class="text-sm" style="color:var(--color-text-muted)">[署名 / 部门]</p>
    </div>
    <footer class="slide-footer">1 / 3</footer>
  </section>

  <!-- Slide 2: 内容页 -->
  <section class="ppt-slide" data-slide="2" style="background:var(--color-bg)">
    <div class="slide-content">
      <h2 class="text-3xl font-bold mb-2" style="color:var(--color-primary)">[章节标题]</h2>
      <p class="text-sm mb-8" style="color:var(--color-text-muted)">[章节说明]</p>
      <div class="grid grid-cols-3 gap-8">
        <div class="bg-[var(--color-bg-card)] rounded-[var(--radius-lg)] p-8 shadow-[var(--shadow-card)] text-center">
          <div class="text-5xl font-bold mb-3" style="color:var(--color-primary)">[数值]<span class="text-xl font-normal ml-1" style="color:var(--color-text-muted)">[单位]</span></div>
          <p class="text-sm font-medium" style="color:var(--color-text)">[指标名称]</p>
          <span class="text-xs mt-2 inline-block px-3 py-1 rounded-full" style="color:var(--color-success);background:var(--color-primary-light)">[趋势标签]</span>
        </div>
        <div class="bg-[var(--color-bg-card)] rounded-[var(--radius-lg)] p-8 shadow-[var(--shadow-card)] text-center">
          <div class="text-5xl font-bold mb-3" style="color:var(--color-primary)">[数值]<span class="text-xl font-normal ml-1" style="color:var(--color-text-muted)">[单位]</span></div>
          <p class="text-sm font-medium" style="color:var(--color-text)">[指标名称]</p>
          <span class="text-xs mt-2 inline-block px-3 py-1 rounded-full" style="color:var(--color-success);background:var(--color-primary-light)">[趋势标签]</span>
        </div>
        <div class="bg-[var(--color-bg-card)] rounded-[var(--radius-lg)] p-8 shadow-[var(--shadow-card)] text-center">
          <div class="text-5xl font-bold mb-3" style="color:var(--color-success)">[数值]<span class="text-xl font-normal ml-1" style="color:var(--color-text-muted)">[单位]</span></div>
          <p class="text-sm font-medium" style="color:var(--color-text)">[指标名称]</p>
          <span class="text-xs mt-2 inline-block px-3 py-1 rounded-full" style="color:var(--color-primary);background:var(--color-primary-light)">[趋势标签]</span>
        </div>
      </div>
    </div>
    <footer class="slide-footer">2 / 3</footer>
  </section>

  <!-- Slide 3: 总结 -->
  <section class="ppt-slide" data-slide="3" style="background:var(--color-bg)">
    <div class="slide-content flex flex-col justify-center items-center text-center">
      <h2 class="text-4xl font-bold mb-8" style="color:var(--color-primary)">[总结标题]</h2>
      <div class="bg-[var(--color-primary-light)] rounded-[var(--radius-lg)] p-8 max-w-2xl mx-auto text-left">
        <p class="text-lg leading-relaxed" style="color:var(--color-text)">[此处填写总结内容。本版式为 PPT Slide 全屏翻页模式，支持按钮和键盘 ← → 翻页，适合演示汇报场景。]</p>
      </div>
      <p class="text-sm mt-10" style="color:var(--color-text-muted)">[署名] · [日期]</p>
    </div>
    <footer class="slide-footer">3 / 3</footer>
  </section>

  <!-- 翻页按钮 -->
  <button class="ppt-nav-btn ppt-prev-btn" id="prevBtn" disabled>← 上一页</button>
  <button class="ppt-nav-btn ppt-next-btn" id="nextBtn">下一页 →</button>
</div>

<script>
let currentSlide = 1;
const totalSlides = 3;

function updateButtons() {
  document.getElementById('prevBtn').disabled = currentSlide <= 1;
  document.getElementById('nextBtn').disabled = currentSlide >= totalSlides;
}

function goToSlide(n) {
  if (n < 1 || n > totalSlides) return;
  const slides = document.querySelectorAll('.ppt-slide');
  slides.forEach(s => s.classList.remove('active'));
  slides[n - 1].classList.add('active');
  currentSlide = n;
  updateButtons();
}

document.getElementById('prevBtn').addEventListener('click', () => goToSlide(currentSlide - 1));
document.getElementById('nextBtn').addEventListener('click', () => goToSlide(currentSlide + 1));

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goToSlide(currentSlide + 1);
  if (e.key === 'ArrowLeft') goToSlide(currentSlide - 1);
});

document.querySelectorAll('.theme-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.documentElement.setAttribute('data-theme', btn.dataset.theme);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

updateButtons();
</script>
</body>
</html>
