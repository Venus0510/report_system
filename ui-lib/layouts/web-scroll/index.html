<!DOCTYPE html>
<html lang="zh-CN" data-theme="business-blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自由滚动网页 — 版式预览</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../../design-tokens/tokens.css">
<link rel="stylesheet" href="layout.css">
<style>
  body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); margin: 0; }
  .top-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: var(--color-bg-card); border-bottom: 1px solid var(--color-border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
  .back-link { color: var(--color-accent); text-decoration: none; font-size: var(--text-sm); }
  .theme-switcher { display: flex; gap: 6px; }
  .theme-btn { padding: 4px 12px; border-radius: var(--radius-sm); border: 2px solid var(--color-border); background: var(--color-bg-card); color: var(--color-text); cursor: pointer; font-size: var(--text-xs); }
  .theme-btn.active { border-color: var(--color-primary); background: var(--color-primary); color: #fff; font-weight: 600; }
</style>
</head>
<body>
<div class="top-bar">
  <a href="../../gallery.html" class="back-link">&larr; 返回组件库总览</a>
  <div class="theme-switcher">
    <button class="theme-btn active" data-theme="business-blue">商务蓝白</button>
    <button class="theme-btn" data-theme="dark-tech">暗黑科技</button>
    <button class="theme-btn" data-theme="fresh-clean">清新简约</button>
  </div>
</div>

<div class="web-scroll-container" style="margin-top:56px;">

  <!-- Hero -->
  <section class="web-scroll-section hero" data-block="hero">
    <h1 class="text-5xl font-bold mb-4" style="color:var(--color-primary)">货币基金月度估值分析</h1>
    <p class="text-xl mb-8" style="color:var(--color-text-muted)">专业、透明、及时的基金绩效评估</p>
    <div class="h-1 w-24 rounded-full mx-auto mb-8" style="background:var(--color-accent)"></div>
    <p class="text-sm max-w-xl mx-auto" style="color:var(--color-text-muted)">覆盖全市场货币基金 · 日均净值追踪 · 多维度归因分析</p>
  </section>

  <!-- 核心指标 -->
  <section class="web-scroll-section" data-block="features">
    <h2 class="text-3xl font-bold mb-8 text-center" style="color:var(--color-primary)">核心指标</h2>
    <div class="grid grid-cols-3 gap-6">
      <div class="bg-[var(--color-bg-card)] rounded-[var(--radius-lg)] p-8 shadow-[var(--shadow-card)] text-center">
        <div class="text-5xl font-bold mb-3" style="color:var(--color-primary)">3.28<span class="text-xl font-normal ml-1" style="color:var(--color-text-muted)">%</span></div>
        <p class="text-sm font-medium" style="color:var(--color-text)">七日年化收益率</p>
      </div>
      <div class="bg-[var(--color-bg-card)] rounded-[var(--radius-lg)] p-8 shadow-[var(--shadow-card)] text-center">
        <div class="text-5xl font-bold mb-3" style="color:var(--color-accent)">0.5892<span class="text-xl font-normal ml-1" style="color:var(--color-text-muted)">元</span></div>
        <p class="text-sm font-medium" style="color:var(--color-text)">万份收益</p>
      </div>
      <div class="bg-[var(--color-bg-card)] rounded-[var(--radius-lg)] p-8 shadow-[var(--shadow-card)] text-center">
        <div class="text-5xl font-bold mb-3" style="color:var(--color-success)">156<span class="text-xl font-normal ml-1" style="color:var(--color-text-muted)">亿</span></div>
        <p class="text-sm font-medium" style="color:var(--color-text)">管理规模</p>
      </div>
    </div>
  </section>

  <!-- 对比分析 -->
  <section class="web-scroll-section" data-block="case">
    <h2 class="text-3xl font-bold mb-8" style="color:var(--color-primary)">基金对比</h2>
    <div class="overflow-x-auto rounded-[var(--radius-lg)] border shadow-[var(--shadow-card)]" style="border-color:var(--color-border)">
      <table class="w-full text-sm border-collapse">
        <thead>
          <tr style="background:var(--color-primary)">
            <th class="text-left p-4 font-semibold text-white">基金</th>
            <th class="text-right p-4 font-semibold text-white">七日年化</th>
            <th class="text-right p-4 font-semibold text-white">万份收益</th>
            <th class="text-right p-4 font-semibold text-white">近一月回报</th>
          </tr>
        </thead>
        <tbody>
          <tr style="background:var(--color-bg-card)"><td class="p-4 font-medium">天弘货币A</td><td class="p-4 text-right font-mono" style="color:var(--color-primary)">2.15%</td><td class="p-4 text-right font-mono">0.5892</td><td class="p-4 text-right font-mono" style="color:var(--color-success)">0.18%</td></tr>
          <tr style="background:var(--color-primary-light);opacity:0.5"><td class="p-4 font-medium">南方现金A</td><td class="p-4 text-right font-mono" style="color:var(--color-primary)">2.08%</td><td class="p-4 text-right font-mono">0.5701</td><td class="p-4 text-right font-mono" style="color:var(--color-success)">0.16%</td></tr>
          <tr style="background:var(--color-bg-card)"><td class="p-4 font-medium">华夏现金A</td><td class="p-4 text-right font-mono" style="color:var(--color-accent)">2.21%</td><td class="p-4 text-right font-mono">0.6013</td><td class="p-4 text-right font-mono" style="color:var(--color-success)">0.19%</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- CTA -->
  <section class="web-scroll-section cta" data-block="cta">
    <h2 class="text-3xl font-bold mb-4" style="color:var(--color-primary)">了解更多</h2>
    <p class="text-lg mb-8" style="color:var(--color-text-muted)">获取完整报告或预约产品演示</p>
    <button class="px-8 py-3 rounded-[var(--radius-md)] text-white font-semibold text-base border-none cursor-pointer" style="background:var(--color-primary)">联系我们</button>
  </section>

</div>

<script>
document.querySelectorAll('.theme-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.documentElement.setAttribute('data-theme', btn.dataset.theme);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});
</script>
</body>
</html>
