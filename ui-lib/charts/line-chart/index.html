<!DOCTYPE html>
<html lang="zh-CN" data-theme="business-blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>折线图 — 组件预览</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<link rel="stylesheet" href="../../design-tokens/tokens.css">
<style>
  body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-text); margin: 0; padding: 24px; }
  .preview-container { max-width: 960px; margin: 0 auto; }
  .back-link { color: var(--color-accent); text-decoration: none; font-size: var(--text-sm); display: inline-block; margin-bottom: 16px; }
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .page-header h1 { font-size: var(--text-xl); font-weight: 700; margin: 0; }
  .theme-switcher { display: flex; gap: 8px; }
  .theme-btn { padding: 6px 16px; border-radius: var(--radius-sm); border: 2px solid var(--color-border); background: var(--color-bg-card); color: var(--color-text); cursor: pointer; font-size: var(--text-sm); }
  .theme-btn:hover { border-color: var(--color-accent); }
  .theme-btn.active { border-color: var(--color-primary); background: var(--color-primary-light); color: var(--color-primary); font-weight: 600; }
  .section { margin-bottom: 32px; }
  .section-title { font-size: var(--text-lg); font-weight: 600; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--color-border); display: flex; justify-content: space-between; align-items: center; }
  .preview-area { background: var(--color-bg); border-radius: var(--radius-lg); padding: 24px; border: 1px dashed var(--color-border); }
  .props-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  .props-table th { text-align: left; padding: 10px 14px; background: var(--color-primary-light); color: var(--color-primary); font-weight: 600; }
  .props-table td { padding: 10px 14px; border-bottom: 1px solid var(--color-border); }
  .code-block { background: #1e293b; border-radius: var(--radius-md); padding: 20px; overflow-x: auto; position: relative; }
  .code-block pre { margin: 0; color: #e2e8f0; font-family: 'SF Mono', monospace; font-size: 13px; line-height: 1.6; white-space: pre; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .btn { padding: 8px 18px; border-radius: var(--radius-sm); border: none; cursor: pointer; font-size: var(--text-sm); font-weight: 500; }
  .btn-primary { background: var(--color-primary); color: #fff; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-secondary { background: var(--color-bg-card); color: var(--color-text); border: 1px solid var(--color-border); }
  .btn-sm { padding: 4px 10px; font-size: var(--text-xs); }
  textarea.editor { width: 100%; height: 200px; font-family: 'SF Mono', monospace; font-size: 13px; padding: 12px; border-radius: var(--radius-md); border: 2px solid var(--color-border); background: var(--color-bg-card); color: var(--color-text); resize: vertical; }
  textarea.editor:focus { outline: none; border-color: var(--color-accent); }
  .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 10px 22px; border-radius: var(--radius-md); font-size: var(--text-sm); z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="preview-container">
  <a href="../../gallery.html" class="back-link">&larr; 返回组件库总览</a>
  <div class="page-header">
    <h1>折线图</h1>
    <div class="theme-switcher">
      <button class="theme-btn active" data-theme="business-blue">商务蓝白</button>
      <button class="theme-btn" data-theme="dark-tech">暗黑科技</button>
      <button class="theme-btn" data-theme="fresh-clean">清新简约</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">交互式预览 <button class="btn btn-secondary btn-sm" onclick="refreshChart()">刷新图表</button></div>
    <div class="preview-area">
      <div id="chartContainer" style="width:100%;height:400px;"></div>
      <details style="margin-top:16px;">
        <summary style="cursor:pointer;font-size:var(--text-sm);color:var(--color-text-muted);">编辑数据（JSON）</summary>
        <textarea class="editor" id="dataEditor" spellcheck="false"></textarea>
      </details>
    </div>
  </div>

  <div class="section">
    <div class="section-title">数据接口（Props）</div>
    <table class="props-table">
      <thead><tr><th>属性</th><th>类型</th><th>默认值</th><th>说明</th></tr></thead>
      <tbody>
        <tr><td>data</td><td>Array</td><td>—（必填）</td><td>多系列：[{ name, values:[{x,y}] }] 或单系列：[{x,y}]</td></tr>
        <tr><td>title</td><td>String</td><td>''</td><td>图表标题</td></tr>
        <tr><td>xField</td><td>String</td><td>'x'</td><td>X轴字段名</td></tr>
        <tr><td>yField</td><td>String</td><td>'y'</td><td>Y轴字段名</td></tr>
        <tr><td>height</td><td>Number</td><td>400</td><td>图表高度（px）</td></tr>
        <tr><td>colors</td><td>Array</td><td>[3个CSS变量]</td><td>系列颜色数组</td></tr>
      </tbody>
    </table>
  </div>

  <div class="section">
    <div class="section-title">HTML 代码</div>
    <div class="code-block"><pre id="htmlCode"></pre></div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="copyCode()">复制 HTML</button>
      <button class="btn btn-secondary" onclick="window.open(location.href, '_blank')">在新标签页打开</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
document.querySelectorAll('.theme-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.documentElement.setAttribute('data-theme', btn.dataset.theme);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setTimeout(refreshChart, 100);
  });
});

const defaultData = {
  categories: ['5-01','5-05','5-09','5-13','5-17','5-20'],
  series: [
    { name: '天弘货币A', data: [2.12, 2.14, 2.15, 2.13, 2.16, 2.15] },
    { name: '华夏现金A', data: [2.18, 2.19, 2.20, 2.18, 2.22, 2.21] }
  ]
};

let chart;
function refreshChart() {
  if (chart) chart.dispose();
  chart = echarts.init(document.getElementById('chartContainer'));
  let data;
  try { data = JSON.parse(document.getElementById('dataEditor').value); } catch(e) { data = defaultData; }
  const style = getComputedStyle(document.documentElement);
  const colors = [style.getPropertyValue('--color-primary').trim(), style.getPropertyValue('--color-accent').trim(), style.getPropertyValue('--color-success').trim()];
  chart.setOption({
    tooltip: { trigger: 'axis' },
    legend: { data: data.series.map(s => s.name), textStyle: { color: style.getPropertyValue('--color-text-muted') }, top: 0 },
    grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
    xAxis: { type: 'category', data: data.categories, axisLabel: { color: style.getPropertyValue('--color-text-muted') } },
    yAxis: { type: 'value', name: '%', axisLabel: { color: style.getPropertyValue('--color-text-muted') } },
    series: data.series.map((s, i) => ({
      name: s.name, type: 'line', data: s.data, smooth: true,
      lineStyle: { color: colors[i] }, itemStyle: { color: colors[i] }
    }))
  });
}

document.getElementById('dataEditor').value = JSON.stringify(defaultData, null, 2);

const htmlTemplate = `<div data-cid="line-chart" class="bg-[var(--color-bg-card)] rounded-[var(--radius-lg)] p-6 shadow-[var(--shadow-card)]">
  <h3 class="text-base font-semibold mb-4" style="color:var(--color-text)">七日年化收益率走势</h3>
  <div id="lineChart" style="width:100%;height:400px;"></div>
</div>
<script>
  var chart = echarts.init(document.getElementById('lineChart'));
  chart.setOption({
    tooltip: { trigger:'axis' },
    legend: { data:['天弘货币A','华夏现金A'] },
    xAxis: { type:'category', data:['5-01','5-05','5-09','5-13','5-17','5-20'] },
    yAxis: { type:'value', name:'%' },
    series: [
      { name:'天弘货币A', type:'line', data:[2.12,2.14,2.15,2.13,2.16,2.15], smooth:true, lineStyle:{ color:'var(--color-primary)' }, itemStyle:{ color:'var(--color-primary)' } },
      { name:'华夏现金A', type:'line', data:[2.18,2.19,2.20,2.18,2.22,2.21], smooth:true, lineStyle:{ color:'var(--color-accent)' }, itemStyle:{ color:'var(--color-accent)' } }
    ]
  });
<\/script>`;
document.getElementById('htmlCode').textContent = htmlTemplate;

function copyCode() {
  navigator.clipboard.writeText(htmlTemplate).then(() => { const t=document.getElementById('toast'); t.textContent='已复制到剪贴板'; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); });
}

refreshChart();
</script>
</body>
</html>
