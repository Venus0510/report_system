<div data-cid="line-chart" class="bg-[var(--color-bg-card)] rounded-[var(--radius-lg)] p-6 shadow-[var(--shadow-card)]">
  <h3 class="text-base font-semibold mb-4" style="color:var(--color-text)">七日年化收益率走势</h3>
  <div id="lineChart" style="width:100%;height:400px;"></div>
</div>
<script>
  var chart = echarts.init(document.getElementById('lineChart'));
  chart.setOption({
    tooltip: { trigger: 'axis' },
    legend: { data: ['天弘货币A', '华夏现金A'], textStyle: { color: 'var(--color-text-muted)' }, top: 0 },
    grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
    xAxis: { type: 'category', data: ['5-01','5-05','5-09','5-13','5-17','5-20'], axisLabel: { color: 'var(--color-text-muted)' } },
    yAxis: { type: 'value', name: '%', axisLabel: { color: 'var(--color-text-muted)' } },
    series: [
      { name: '天弘货币A', type: 'line', data: [2.12, 2.14, 2.15, 2.13, 2.16, 2.15], smooth: true, lineStyle: { color: 'var(--color-primary)' }, itemStyle: { color: 'var(--color-primary)' } },
      { name: '华夏现金A', type: 'line', data: [2.18, 2.19, 2.20, 2.18, 2.22, 2.21], smooth: true, lineStyle: { color: 'var(--color-accent)' }, itemStyle: { color: 'var(--color-accent)' } }
    ]
  });
</script>
