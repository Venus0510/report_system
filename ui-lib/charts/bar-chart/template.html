<div data-cid="bar-chart" class="bg-[var(--color-bg-card)] rounded-[var(--radius-lg)] p-6 shadow-[var(--shadow-card)]">
  <h3 class="text-base font-semibold mb-4" style="color:var(--color-text)">各类资产规模对比</h3>
  <div id="barChart" style="width:100%;height:400px;"></div>
</div>
<script>
  var chart = echarts.init(document.getElementById('barChart'));
  chart.setOption({
    tooltip: { trigger: 'axis' },
    grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
    xAxis: { type: 'category', data: ['国债', '同业存单', '金融债', '企业短融', '逆回购'], axisLabel: { color: 'var(--color-text-muted)' } },
    yAxis: { type: 'value', name: '亿元', axisLabel: { color: 'var(--color-text-muted)' } },
    series: [{ type: 'bar', data: [42.5, 38.2, 25.8, 18.6, 12.3], itemStyle: { color: 'var(--color-primary)', borderRadius: [6, 6, 0, 0] }, barWidth: '50%' }]
  });
</script>
